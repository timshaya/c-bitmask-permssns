name: C tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install Python CI dependencies
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Compile C program
        run: gcc -Wall -Wextra -std=c11 c-bitmask-permssns/main.c -o app

      - name: Run Python tests
        run: python -m pytest -q tests/test_main.py

      - name: Test cardinality checker
        run: python -m unittest discover -s scripts -p 'test_check_cardinality.py'

      - name: Check monitoring label cardinality risks
        run: python scripts/check_cardinality.py .
